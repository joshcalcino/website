<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="$kind">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:image" content="$image">
  <link rel="icon" href="/website/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/website/assets/site.css">
$extra_styles
  <script src="/website/assets/site.js" defer></script>
</head>
<body class="$body_class" style="--page-image:url('$background')">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="mobile-name" href="/website/">Josh Calcino</a>
      <button class="menu-toggle" data-menu-toggle aria-controls="site-nav" aria-expanded="false" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
      <nav id="site-nav" class="site-nav" aria-label="Main navigation">
        <a href="/website/">Home</a>
        <a href="/website/research/" aria-current="page">Research</a>
        <a href="/website/public-outreach/">Public Outreach</a>
        <a href="/website/astrophotography/">Astrophotography</a>
      </nav>
    </div>
  </header>
  <main id="main">$body</main>
  <footer class="site-footer"><span>© Josh Calcino.</span></footer>
</body>
</html>
