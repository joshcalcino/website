<article class="panel research-card" id="$slug">
  <div>
    <h2>$title</h2>
    $summary
    <div class="actions"><a class="button" href="$route">Read More</a>$paper_link</div>
  </div>
  <figure>
    <a href="$route"><img src="$image"$dimensions alt="$alt" loading="lazy" decoding="async"></a>
    <figcaption>$caption</figcaption>
  </figure>
</article>
